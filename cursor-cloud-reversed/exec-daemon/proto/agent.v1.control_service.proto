import "aiserver/v1/utils.proto";

// HTTP server bound by `exec-daemon serve --port` (this run: TCP 26053).
service ControlService {
  rpc Ping(PingRequest) returns (PingResponse);

  // Capabilities supported (e.g. computer use).
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);

  // Spawn a process; streams stdout/stderr/exit.
  rpc Exec(ExecRequest) returns (stream ExecResponse);

  // Filesystem browsing (arbitrary paths).
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);

  // File read / write (arbitrary filesystem paths).
  rpc ReadTextFile(ReadTextFileRequest) returns (ReadTextFileResponse);
  rpc WriteTextFile(WriteTextFileRequest) returns (WriteTextFileResponse);

  // Binary file read / write.
  rpc ReadBinaryFile(ReadBinaryFileRequest) returns (ReadBinaryFileResponse);
  rpc WriteBinaryFile(WriteBinaryFileRequest) returns (WriteBinaryFileResponse);

  // Workspace-contained streaming file export for user-initiated saves.
  rpc ExportFile(ExportFileRequest) returns (stream ExportFileResponse);

  // Git
  rpc GetDiff(aiserver.v1.GetDiffRequest) returns (aiserver.v1.GetDiffResponse);
  rpc BatchGetDiff(BatchGetDiffRequest) returns (BatchGetDiffResponse);
  rpc GetWorkspaceChangesHash(GetWorkspaceChangesHashRequest) returns (GetWorkspaceChangesHashResponse);
  rpc RefreshGithubAccessToken(RefreshGithubAccessTokenRequest) returns (RefreshGithubAccessTokenResponse);

  // Remote access (cursor-server / VS Code compatible remote).
  rpc WarmRemoteAccessServer(WarmRemoteAccessServerRequest) returns (WarmRemoteAccessServerResponse);

  // Artifact uploads (walkthrough screenshots/videos under /opt/cursor/artifacts
  // and /cursor/stores/<bcId>/artifacts).
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);
  rpc UploadArtifacts(UploadArtifactsRequest) returns (UploadArtifactsResponse);
  rpc PersistArtifactsToAgentStore(PersistArtifactsToAgentStoreRequest) returns (PersistArtifactsToAgentStoreResponse);
  rpc PersistArtifactsToParentStore(PersistArtifactsToParentStoreRequest) returns (PersistArtifactsToParentStoreResponse);
  rpc RestoreArtifacts(RestoreArtifactsRequest) returns (RestoreArtifactsResponse);

  rpc GetMcpRefreshTokens(GetMcpRefreshTokensRequest) returns (GetMcpRefreshTokensResponse);

  // Download (but do not start) the cursor server for a given commit.
  // Used so subsequent WarmRemoteAccessServer calls are faster.
  rpc DownloadCursorServer(DownloadCursorServerRequest) returns (DownloadCursorServerResponse);

  // Update the exec-daemon's environment variables for subsequent process spawns.
  // Does NOT affect already-running processes.
  rpc UpdateEnvironmentVariables(UpdateEnvironmentVariablesRequest) returns (UpdateEnvironmentVariablesResponse);

  // Per-scope secrets for shell injection: the daemon sets them on exactly the
  // shell commands whose ShellArgs.secret_scope_id matches (a Grok Bot's agent
  // id), never on the daemon-wide environment, so a bot's values are absent
  // from every other command's environment and shell snapshot by default. The
  // scope id is caller-asserted under the daemon's shared bearer token, so
  // this is not a boundary against a hostile caller that already holds that
  // token (such a caller can also Exec or rewrite the daemon environment); the
  // box is one trust domain. With `secrets` unset the call only reports the
  // revision the daemon holds; with it set the daemon replaces the scope's
  // values at `revision`, ignoring a push older than what it already holds.
  // Revisions come from the server; values live in daemon memory only.
  rpc SyncScopedSecrets(SyncScopedSecretsRequest) returns (SyncScopedSecretsResponse);

  // Reload agent skills from disk (~/.cursor/skills/, workspace skills, etc.).
  // Call after writing new SKILL.md files so the next agent turn sees them.
  rpc ReloadAgentSkills(ReloadAgentSkillsRequest) returns (ReloadAgentSkillsResponse);

  // Reload plugin-backed skills/subagents after the cloud harness materializes
  // plugin files onto disk. Empty reload_targets means "reload everything".
  rpc ReloadPlugins(ReloadPluginsRequest) returns (ReloadPluginsResponse);

  // Download a plugin artifact tarball from a presigned URL and extract it on the VM.
  rpc InstallPluginArtifact(InstallPluginArtifactRequest) returns (InstallPluginArtifactResponse);

  // Load (and optionally reconcile) session MCP servers on the daemon from a
  // desired MCP config. The same operation the private-worker bridge performs
  // in-process at claim time, exposed for co-located callers (e.g. the Sand
  // in-box host) whose MCP config changes while the daemon runs. Servers are
  // registered lazily (child processes spawn on first use); servers already
  // registered with the same config are left untouched.
  rpc LoadMcpServers(LoadMcpServersRequest) returns (LoadMcpServersResponse);

  // In-memory per-desktop input lease: who may drive X11 on this VM. A human
  // acquire preempts a computer-use agent and aborts its in-flight input;
  // stamped ComputerUseArgs.desktop_lease_actor_id actions are rejected while
  // another actor holds the desktop. Authoritative on this daemon only.
  rpc DesktopLease(DesktopLeaseRequest) returns (DesktopLeaseResponse);
}

